name = "unified-gmail-hub"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "unified-gmail-hub"
database_id = "69b0ea4b-a479-4e3a-9cd9-646f1de23132"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
crons = ["* * * * *"]

[vars]
ALERT_KEYWORDS = "invoice,pembayaran,otp,verifikasi"

[observability]
enabled = true
head_sampling_rate = 1.0
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[observability.issues]
enabled = true

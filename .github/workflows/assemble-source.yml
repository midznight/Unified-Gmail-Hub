name: Assemble split source files

on:
  push:
    paths:
      - "tmp/parts/**"

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.head_commit.message != 'build: assemble source files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble when requested
        run: |
          if [ ! -f tmp/parts/ASSEMBLE ]; then
            echo "Assembly marker not present; waiting for complete upload."
            exit 0
          fi
          python3 .github/scripts/assemble_parts.py
          node --check src/index.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          Path("/tmp/unified-gmail-hub-ui.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/unified-gmail-hub-ui.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js public/index.html
          git rm -r tmp/parts
          git commit -m "build: assemble source files"
          git push

name: Validate Unified Gmail Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker module syntax
        run: |
          node --check src/index.js
          node --check src/inline-assets.js
      - name: Verify embedded assets match public files
        run: npm run check:inline-assets
      - name: Run backend smoke tests
        run: npm test
      - name: Validate agent skills and repository instructions
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { existsSync, readFileSync } from "node:fs";

          const googleSkill = ".agents/skills/retrieving-developer-knowledge";
          const projectSkill = ".agents/skills/unified-gmail-hub-development";
          const googleText = readFileSync(`${googleSkill}/SKILL.md`, "utf8");
          const projectText = readFileSync(`${projectSkill}/SKILL.md`, "utf8");
          const agentsText = readFileSync("AGENTS.md", "utf8");
          const upstreamText = readFileSync(`${googleSkill}/UPSTREAM.md`, "utf8");
          const googleFrontMatterEnd = googleText.indexOf("---", 3);
          const projectFrontMatterEnd = projectText.indexOf("---", 3);

          assert.ok(googleText.startsWith("---") && googleFrontMatterEnd > 3, "Google skill must have YAML front matter");
          assert.match(googleText.slice(3, googleFrontMatterEnd), /^name: retrieving-developer-knowledge$/m);
          assert.ok(projectText.startsWith("---") && projectFrontMatterEnd > 3, "Project skill must have YAML front matter");
          assert.match(projectText.slice(3, projectFrontMatterEnd), /^name: unified-gmail-hub-development$/m);
          assert.ok(googleText.includes("Project adaptation notice"));
          assert.ok(googleText.includes("official Google documentation"));
          assert.ok(agentsText.includes("unified-gmail-hub-development/SKILL.md"));
          assert.ok(agentsText.includes("Never invent endpoints"));
          assert.ok(upstreamText.includes("06fff9e3edb7fc3c115a1769406047fcaf0a6289"));
          assert.ok(readFileSync(`${googleSkill}/LICENSE`, "utf8").includes("Apache License"));
          for (const file of [
            "references/attribution.md",
            "references/mcp-usage.md",
            "references/api-fallback.md",
            "references/supported-domains.md",
          ]) {
            assert.ok(existsSync(`${googleSkill}/${file}`), `Missing Google skill reference: ${file}`);
          }
          console.log("Validated repository instructions and both project-scoped Agent Skills.");
          NODE
      - name: Validate frontend and manifest
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { Script } from "node:vm";

          const html = readFileSync("public/index.html", "utf8");
          assert.ok(html.trimStart().startsWith("<!DOCTYPE html>"));
          assert.ok(html.trimEnd().endsWith("</html>"));
          assert.ok(html.includes("Perlu Re-auth"));
          assert.ok(html.includes('id="inboxRange"'));
          assert.ok(html.includes('<option value="90d">90 hari terakhir</option>'));
          assert.ok(html.includes('<option value="all">Semua tersimpan</option>'));
          assert.ok(html.includes('sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"'));

          const manifest = JSON.parse(readFileSync("public/manifest.webmanifest", "utf8"));
          assert.equal(manifest.name, "Unified Gmail Hub");
          for (const icon of manifest.icons ?? []) {
            assert.ok(readFileSync(`public/${icon.src.replace(/^\//, "")}`));
          }

          const scripts = [...html.matchAll(/<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
          for (const [index, match] of scripts.entries()) {
            if (match[1].trim()) new Script(match[1], { filename: `inline-script-${index + 1}.js` });
          }

          const embedded = readFileSync("src/inline-assets.js", "utf8");
          assert.ok(embedded.includes("/index.html"));
          assert.ok(embedded.includes("/manifest.webmanifest"));
          console.log(`Validated ${scripts.length} inline script blocks and PWA assets.`);
          NODE
